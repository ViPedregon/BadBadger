[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "badbadger"
version = "0.1.0"
description = "A dialogue-based game with NPC agents and a game master engine"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
web = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]
web-test = [
    "httpx>=0.27,<1",
    "playwright>=1.48,<2",
]
openai = [
    "openai>=2,<3",
    "pydantic>=2,<3",
]

[project.scripts]
badbadger = "badbadger.cli:main"
badbadger-web = "badbadger.web:main"
badbadger-save = "badbadger.backup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
badbadger = ["db/schema.sql", "scenarios/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
